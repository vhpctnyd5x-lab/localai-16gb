name: hakaru
# 公開 repo なので runner は無料・無制限。枝 hakaru（3問）か hakaru-zenbu（全128問）への push、または手動で走る。
# 各 runner は結果を artifact に上げ、最後の 1つの job がまとめて枝 kekka の kekka/ に積む（同時 push の競合を避ける）。
on:
  workflow_dispatch:
    inputs:
      kagiri:
        description: "問題数（0=全部）"
        default: "3"
        type: string
  push:
    branches: ['hakaru*']   # hakaru=3問 / hakaru-zenbu=128問 / 末尾 -f1,-f2 で深さ / -m2507 で頭脳を 2507 版に / -k で数え上げ電卓あり / -t で似た手本あり / -c で計算も電卓 / -d8 で 8段（新しい物差し）
permissions:
  contents: write
jobs:
  hakaru:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: 走らせる
        env:
          KAGIRI: ${{ github.event.inputs.kagiri || (startsWith(github.ref_name, 'hakaru-zenbu') && '0' || (startsWith(github.ref_name, 'hakaru-henka') && '16' || '3')) }}
          HENKA_FILE: ${{ startsWith(github.ref_name, 'hakaru-henka') && 'dougu/actions_henka.txt' || '' }}
          KERNEL_KEISAN: ${{ contains(github.ref_name, '-c') && '1' || '' }}
          DAN: ${{ contains(github.ref_name, '-d8') && '8' || '7' }}
          KERNEL_TEHON: ${{ contains(github.ref_name, '-t') && '1' || '' }}
          KERNEL_KAZOERU: ${{ contains(github.ref_name, '-k') && '1' || '' }}
          ATAMA: ${{ contains(github.ref_name, '-m2507') && '2507' || '' }}
          FUKASA: ${{ endsWith(github.ref_name, '-f2') && '2' || (endsWith(github.ref_name, '-f1') && '1' || '0') }}
        timeout-minutes: 340
        run: bash dougu/actions_hakaru.sh "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kekka-${{ matrix.os }}
          path: kekka_actions/
  tsumu:
    needs: hakaru
    if: always()
    runs-on: ubuntu-24.04
    concurrency: kekka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kekka-*
          merge-multiple: true
          path: ${{ runner.temp }}/k
      - name: 枝 kekka へ
        run: |
          set -e
          ls "$RUNNER_TEMP/k" || { echo "結果なし"; exit 0; }
          git config user.name hakaru-bot; git config user.email hakaru-bot@users.noreply.github.com
          if git fetch -q origin kekka; then git checkout -q -B kekka origin/kekka; else git checkout -q --orphan kekka; git rm -rfq .; fi
          mkdir -p kekka; cp "$RUNNER_TEMP"/k/* kekka/
          git add -f kekka; git commit -qm "kekka: run ${{ github.run_number }} (${{ github.ref_name }})" || { echo "変わりなし"; exit 0; }
          git push -q origin kekka
