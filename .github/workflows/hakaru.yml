name: hakaru
# 公開 repo なので runner は無料・無制限。枝 hakaru（3問）か hakaru-zenbu（全128問）への push、または手動で走る。
# 各 runner は結果を artifact に上げ、最後の 1つの job がまとめて枝 kekka の kekka/ に積む（同時 push の競合を避ける）。
on:
  workflow_dispatch:
    inputs:
      kagiri:
        description: "問題数（0=全部）"
        default: "3"
        type: string
      experiment:
        description: "dougu/jikken/<名前>.env の名前（空欄なら枝の -x名前 を使う）"
        default: ""
        type: string
  push:
    branches: ['hakaru*']   # -x名前 / -pplonly / -ubN / -kvq8,-kvq4 / -kvk8v4 / -fa1 / -nommap / -mlock / -spd06
permissions:
  contents: write
jobs:
  hakaru:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: 走らせる
        env:
          KAGIRI: ${{ github.event.inputs.kagiri || '' }}
          JIKKEN: ${{ github.event.inputs.experiment || '' }}
          PPLONLY: ${{ github.event.inputs.experiment != '' && '1' || '' }}
        timeout-minutes: 340
        run: bash dougu/actions_hakaru.sh "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kekka-${{ matrix.os }}
          path: kekka_actions/
  tsumu:
    needs: hakaru
    if: always()
    runs-on: ubuntu-24.04
    # concurrency は使わない: 同じ組で待ちが2つ以上になると GitHub が古い方を取り消し、結果が積まれない（9/24 実験5本を失った）。
    # 代わりに下で「取り直して積み直す」を何度もやり直す。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kekka-*
          merge-multiple: true
          path: ${{ runner.temp }}/k
      - name: 枝 kekka へ
        run: |
          set -e
          ls "$RUNNER_TEMP/k" || { echo "結果なし"; exit 0; }
          git config user.name hakaru-bot; git config user.email hakaru-bot@users.noreply.github.com
          for i in $(seq 1 30); do
            if git fetch -q origin kekka; then git checkout -q -f -B kekka origin/kekka; else git checkout -q --orphan kekka; git rm -rfq . || true; fi
            mkdir -p kekka; cp "$RUNNER_TEMP"/k/* kekka/
            git add -f kekka; git commit -qm "kekka: run ${{ github.run_number }} (${{ github.ref_name }})" || { echo "変わりなし"; exit 0; }
            git push -q origin kekka && { echo "積んだ（${i}回目）"; exit 0; }
            echo "競合。取り直して積み直す（${i}回目）"; sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "30回やり直しても積めなかった"; exit 1
