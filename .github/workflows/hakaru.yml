name: hakaru
# 公開 repo なので runner は無料・無制限。枝 hakaru への push か手動で走る。結果は枝 kekka の kekka/ に積む。
on:
  workflow_dispatch:
    inputs:
      kagiri: { description: "問題数（0=全部）", default: "3" }
  push:
    branches: [hakaru]
permissions:
  contents: write
jobs:
  hakaru:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: 走らせる
        env:
          KAGIRI: ${{ github.event.inputs.kagiri || '3' }}
        run: bash dougu/actions_hakaru.sh "${{ matrix.os }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "kekka-${{ matrix.os }}", path: kekka_actions/ }
      - name: 結果を枝 kekka へ
        if: always()
        run: |
          set -e
          cp -r kekka_actions "$RUNNER_TEMP/k"
          git config user.name hakaru-bot; git config user.email hakaru-bot@users.noreply.github.com
          if git fetch -q origin kekka; then git checkout -q -B kekka origin/kekka; else git checkout -q --orphan kekka; git rm -rfq .; fi
          mkdir -p kekka; cp "$RUNNER_TEMP"/k/* kekka/
          git add -f kekka; git commit -qm "kekka: ${{ matrix.os }} run ${{ github.run_number }}" || exit 0
          for i in 1 2 3 4 5; do git push -q origin kekka && break; git pull -q --rebase origin kekka; done
